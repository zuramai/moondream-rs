[package]
name = "moondream-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
ort = { version = "=2.0.0-rc.10", features = ["half"] }
half = "2"
image = "0.25"
fast_image_resize = { version = "6.1", features = ["image"] }
rayon = "1.12"
tokenizers = { version = "0.21", features = ["http"] }
npyz = { version = "0.8", features = ["half"] }
memmap2 = "0.9"
flate2 = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
parking_lot = "0.12"
rand = "0.8"
candle-core = "0.11"
candle-nn = "0.11"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = []
cuda = ["ort/cuda", "candle-core/cuda", "candle-nn/cuda"]
coreml = ["ort/coreml"]
metal = ["candle-core/metal", "candle-nn/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
